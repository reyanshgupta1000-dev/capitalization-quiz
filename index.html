<!DOCTYPE html>
<html>
<head>
  <title>Multiplayer Quiz</title>
  <style>
    body {
      font-family: Arial;
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }
    input, button {
      padding: 10px;
      margin: 5px;
    }
  </style>
</head>
<body>

<h1>Capitalization Quiz (Multiplayer)</h1>

<div id="setup">
  <input id="name" placeholder="Enter name">
  <input id="room" placeholder="Enter room code">
  <button onclick="joinRoom()">Join Game</button>
</div>

<div id="game" style="display:none;">
  <h2>Joined Room!</h2>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, set }
from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

// 🔥 YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCBEGw6J76suo9BHgUD1GIiiZbp4ifqJ3E",
  authDomain: "quiz-game-9aa86.firebaseapp.com",
  projectId: "quiz-game-9aa86",
  storageBucket: "quiz-game-9aa86.firebasestorage.app",
  messagingSenderId: "587081071152",
  appId: "1:587081071152:web:203f17274cb2ac99d4cbf5",
  databaseURL: "https://quiz-game-9aa86-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 🌐 JOIN FUNCTION
window.joinRoom = async function () {
  const name = document.getElementById("name").value;
  const room = document.getElementById("room").value;

  if (!name || !room) {
    alert("Enter name and room code");
    return;
  }

  try {
    await set(ref(db, `rooms/${room}/players/${name}`), {
      score: 0
    });

    alert("Joined room: " + room);

    document.getElementById("setup").style.display = "none";
    document.getElementById("game").style.display = "block";

  } catch (err) {
    console.error(err);
    alert("Error joining room");
  }
};
</script>

</body>
</html>
