<!DOCTYPE html>
<html>
<head>
  <title>Capitalization Multiplayer Quiz</title>

  <style>
    body {
      font-family: Arial;
      max-width: 850px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }

    button { padding: 10px; margin: 5px; }
    input { padding: 8px; margin: 5px; }

    #game { display: none; }

    .box {
      background: #f3f3f3;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      text-align: left;
    }

    #leaderboard {
      margin-top: 15px;
      text-align: left;
      background: #e9f5ff;
      padding: 10px;
      border-radius: 8px;
    }

    #timer {
      font-size: 22px;
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>🔥 Capitalization Multiplayer Quiz</h1>

<div class="box">
  <h2>Rules</h2>
  <p>Choose the correctly capitalized sentence.</p>
  <p>Correct answer = 1 point. Wrong answer = 0 points.</p>
  <p>Highest score wins the game.</p>
  <p>Game lasts about 10–20 minutes.</p>
</div>

<!-- SETUP -->
<div id="setup">
  <input id="name" placeholder="Your name">
  <input id="room" placeholder="Room code">
  <button onclick="joinRoom()">Join Game</button>
</div>

<!-- GAME -->
<div id="game">

  <div id="timer">20</div>

  <h2 id="question"></h2>

  <button onclick="answer(0)" id="a1"></button>
  <button onclick="answer(1)" id="a2"></button>

  <div id="leaderboard">
    <h3>Leaderboard</h3>
    <div id="board"></div>
  </div>

</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue }
from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

/* ✅ FIXED FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCBEGw6J76suo9BHgUD1GIiiZbp4ifqJ3E",
  authDomain: "quiz-game-9aa86.firebaseapp.com",
  projectId: "quiz-game-9aa86",
  storageBucket: "quiz-game-9aa86.firebasestorage.app",
  messagingSenderId: "587081071152",
  appId: "1:587081071152:web:203f17274cb2ac99d4cbf5",
  databaseURL: "https://quiz-game-9aa86-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* QUESTIONS */
const questions = [
  { q: "Which is correct?", a1: "i went to london", a2: "I went to London", correct: 1 },
  { q: "Which is correct?", a1: "my name is alex", a2: "My name is Alex", correct: 1 },
  { q: "Which is correct?", a1: "we live in new york", a2: "We live in New York", correct: 1 },
  { q: "Which is correct?", a1: "john is my friend", a2: "John is my friend", correct: 1 },
  { q: "Which is correct?", a1: "i am happy", a2: "I am happy", correct: 1 },
  { q: "Which is correct?", a1: "we went to paris", a2: "We went to Paris", correct: 1 },
  { q: "Which is correct?", a1: "she lives in canada", a2: "She lives in Canada", correct: 1 },
  { q: "Which is correct?", a1: "i love school", a2: "I love school", correct: 1 },
  { q: "Which is correct?", a1: "we are going to texas", a2: "We are going to Texas", correct: 1 },
  { q: "Which is correct?", a1: "he is my friend", a2: "He is my friend", correct: 1 },
  { q: "Which is correct?", a1: "they live in florida", a2: "They live in Florida", correct: 1 },
  { q: "Which is correct?", a1: "she is smart", a2: "She is smart", correct: 1 },
  { q: "Which is correct?", a1: "we study english", a2: "We study English", correct: 1 },
  { q: "Which is correct?", a1: "my brother is tall", a2: "My brother is tall", correct: 1 },
  { q: "Which is correct?", a1: "i play soccer", a2: "I play soccer", correct: 1 }
];

let playerName = "";
let roomCode = "";
let qIndex = 0;
let time = 20;
let timer;

/* JOIN */
window.joinRoom = async function () {
  playerName = document.getElementById("name").value;
  roomCode = document.getElementById("room").value;

  if (!playerName || !roomCode) return alert("Enter name and room code");

  await set(ref(db, `rooms/${roomCode}/players/${playerName}`), {
    score: 0
  });

  document.getElementById("setup").style.display = "none";
  document.getElementById("game").style.display = "block";

  loadQuestion();
  listenLeaderboard();
  startTimer();
};

/* TIMER */
function startTimer() {
  clearInterval(timer);
  time = 20;

  timer = setInterval(() => {
    time--;
    document.getElementById("timer").innerText = time;

    if (time <= 0) nextQuestion();
  }, 1000);
}

/* LOAD QUESTION */
function loadQuestion() {
  const q = questions[qIndex];

  document.getElementById("question").innerText = q.q;
  document.getElementById("a1").innerText = q.a1;
  document.getElementById("a2").innerText = q.a2;

  startTimer();
}

/* ANSWER */
window.answer = async function (choice) {
  const q = questions[qIndex];

  if (choice === q.correct) {
    const playerRef = ref(db, `rooms/${roomCode}/players/${playerName}`);
    const snap = await get(playerRef);

    let score = snap.val()?.score || 0;

    await update(playerRef, { score: score + 1 });
  }

  nextQuestion();
};

/* NEXT QUESTION */
function nextQuestion() {
  qIndex++;

  if (qIndex >= questions.length) {
    document.getElementById("game").innerHTML =
      "<h2>🎉 Game Over!</h2><p>Check leaderboard for winner!</p>";
    return;
  }

  loadQuestion();
}

/* LEADERBOARD */
function listenLeaderboard() {
  onValue(ref(db, `rooms/${roomCode}/players`), (snap) => {
    const data = snap.val() || {};
    let html = "";

    for (let p in data) {
      html += `<p><b>${p}</b>: ${data[p].score}</p>`;
    }

    document.getElementById("board").innerHTML = html;
  });
}

</script>

</body>
</html>
