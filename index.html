<!DOCTYPE html>
<html>
<head>
  <title>Firebase Multiplayer Quiz</title>
  <style>
    body {
      font-family: Arial;
      max-width: 700px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }
    button { padding: 10px; margin: 5px; }
    input { padding: 8px; margin: 5px; }
    #game { display: none; }
  </style>
</head>

<body>

<h1>Multiplayer Quiz Game</h1>

<!-- SETUP -->
<div id="setup">
  <input id="name" placeholder="Your name">
  <input id="room" placeholder="Room code">
  <button onclick="joinRoom()">Join Game</button>
</div>

<!-- GAME -->
<div id="game">
  <h2 id="question"></h2>

  <button onclick="answer(0)" id="a1"></button>
  <button onclick="answer(1)" id="a2"></button>

  <p id="info"></p>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue }
from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

/* =========================
   🔥 YOUR FIREBASE CONFIG
   ========================= */
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCBEGw6J76suo9BHgUD1GIiiZbp4ifqJ3E",
  authDomain: "quiz-game-9aa86.firebaseapp.com",
  projectId: "quiz-game-9aa86",
  storageBucket: "quiz-game-9aa86.firebasestorage.app",
  messagingSenderId: "587081071152",
  appId: "1:587081071152:web:203f17274cb2ac99d4cbf5",
  measurementId: "G-H7V5291781"
};

/* ========================= */

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// QUESTIONS
const questions = [
  { q: "Which is correct?", a1: "i like pizza", a2: "I like pizza", correct: 1 },
  { q: "Which is correct?", a1: "we live in new york", a2: "We live in New York", correct: 1 },
  { q: "Which is correct?", a1: "my name is john", a2: "My name is John", correct: 1 },
  { q: "Which is correct?", a1: "he is happy", a2: "He is happy", correct: 1 }
];

let playerName = "";
let roomCode = "";
let qIndex = 0;

// JOIN ROOM
window.joinRoom = async function () {
  playerName = document.getElementById("name").value;
  roomCode = document.getElementById("room").value;

  if (!playerName || !roomCode) {
    alert("Enter name and room code");
    return;
  }

  await set(ref(db, `rooms/${roomCode}/players/${playerName}`), {
    score: 0
  });

  document.getElementById("setup").style.display = "none";
  document.getElementById("game").style.display = "block";

  loadQuestion();

  // live debug (optional)
  onValue(ref(db, `rooms/${roomCode}/players`), (snap) => {
    console.log("Players:", snap.val());
  });
};

// LOAD QUESTION
function loadQuestion() {
  const q = questions[qIndex];

  document.getElementById("question").innerText = q.q;
  document.getElementById("a1").innerText = q.a1;
  document.getElementById("a2").innerText = q.a2;

  document.getElementById("info").innerText =
    "Question " + (qIndex + 1);
}

// ANSWER
window.answer = async function (choice) {
  const q = questions[qIndex];

  if (choice === q.correct) {
    const playerRef = ref(db, `rooms/${roomCode}/players/${playerName}`);

    const snap = await get(playerRef);
    let score = snap.val().score;

    await update(playerRef, { score: score + 1 });
  }

  qIndex++;

  if (qIndex >= questions.length) {
    document.getElementById("game").innerHTML =
      "<h2>Game Over!</h2>";
    return;
  }

  loadQuestion();
};

</script>

</body>
</html>
