<!DOCTYPE html>
<html>
<head>
  <title>Quiz Game</title>
</head>
<body>

<h1>Quiz Multiplayer Test</h1>

<input id="name" placeholder="Name">
<input id="room" placeholder="Room code">

<button id="joinBtn">Join Game</button>

<p id="status"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, set }
from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCBEGw6J76suo9BHgUD1GIiiZbp4ifqJ3E",
  authDomain: "quiz-game-9aa86.firebaseapp.com",
  projectId: "quiz-game-9aa86",
  storageBucket: "quiz-game-9aa86.firebasestorage.app",
  messagingSenderId: "587081071152",
  appId: "1:587081071152:web:203f17274cb2ac99d4cbf5",
  databaseURL: "https://quiz-game-9aa86-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

async function joinRoom() {
  const name = document.getElementById("name").value;
  const room = document.getElementById("room").value;

  document.getElementById("status").innerText = "Button clicked";

  if (!name || !room) {
    alert("Enter name and room");
    return;
  }

  await set(ref(db, `rooms/${room}/players/${name}`), {
    score: 0
  });

  document.getElementById("status").innerText = "Joined " + room;
}

document.getElementById("joinBtn").addEventListener("click", joinRoom);
</script>

</body>
</html>
