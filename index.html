<!DOCTYPE html>
<html>
<head>
  <title>Capitalization Multiplayer Quiz</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: white;
      text-align: center;
    }

    .card {
      background: white;
      color: black;
      margin: 15px auto;
      padding: 20px;
      max-width: 850px;
      border-radius: 12px;
    }

    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    #game { display: none; }

    .answer {
      display: block;
      width: 80%;
      margin: 10px auto;
      color: black;
    }

    #leaderboard { display: none; }

    #timer {
      font-size: 24px;
      color: red;
    }

    #topbar {
      position: fixed;
      top: 10px;
      right: 10px;
      background: black;
      padding: 8px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div id="topbar">Room: <span id="roomDisplay">---</span></div>

<h1>🔥 Capitalization Multiplayer Quiz</h1>

<!-- ================= SETUP ================= -->
<div id="setup" class="card">
  <input id="name" placeholder="Your name">
  <input id="room" placeholder="Room code">
  <br>
  <button onclick="createGame()">Create Game</button>
  <button onclick="joinGame()">Join Game</button>
</div>

<!-- ================= LOBBY ================= -->
<div id="lobby" class="card" style="display:none;">
  <h2>Lobby</h2>
  <button id="startBtn" onclick="startGame()" style="display:none;">Start Game</button>
  <div id="players"></div>
</div>

<!-- ================= GAME ================= -->
<div id="game">

  <div class="card">
    <div id="qNum"></div>
    <div id="timer">20</div>
    <h2 id="question"></h2>

    <button class="answer" onclick="answer(0)" id="a1"></button>
    <button class="answer" onclick="answer(1)" id="a2"></button>
  </div>

  <div class="card" id="leaderboard">
    <h3>Leaderboard</h3>
    <div id="board"></div>
  </div>

</div>

<!-- ================= FIREBASE ================= -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue }
from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCBEGw6J76suo9BHgUD1GIiiZbp4ifqJ3E",
  authDomain: "quiz-game-9aa86.firebaseapp.com",
  projectId: "quiz-game-9aa86",
  storageBucket: "quiz-game-9aa86.firebasestorage.app",
  messagingSenderId: "587081071152",
  appId: "1:587081071152:web:203f17274cb2ac99d4cbf5",
  databaseURL: "https://quiz-game-9aa86-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ================= QUESTIONS ================= */
const questions = [
  ["i went to london", "I went to London"],
  ["my name is alex", "My name is Alex"],
  ["we live in new york", "We live in New York"],
  ["john is my friend", "John is my friend"],
  ["i am happy", "I am happy"],
  ["we went to paris", "We went to Paris"],
  ["she lives in canada", "She lives in Canada"],
  ["i love school", "I love school"],
  ["he is my friend", "He is my friend"],
  ["they live in florida", "They live in Florida"],
  ["we study english", "We study English"],
  ["she is smart", "She is smart"],
  ["my brother is tall", "My brother is tall"],
  ["i play soccer", "I play Soccer"],
  ["we are learning grammar", "We are learning grammar"]
];

let playerName = "";
let roomCode = "";
let host = "";
let index = 0;
let correct = 0;
let timer;

/* ================= CREATE ================= */
window.createGame = async function () {
  playerName = name.value;
  roomCode = room.value;
  host = playerName;

  await set(ref(db, "rooms/" + roomCode), {
    host,
    state: "lobby",
    index: 0
  });

  await set(ref(db, `rooms/${roomCode}/players/${playerName}`), {
    score: 0
  });

  enterLobby();
};

/* ================= JOIN ================= */
window.joinGame = async function () {
  playerName = name.value;
  roomCode = room.value;

  const snap = await get(ref(db, "rooms/" + roomCode));
  if (!snap.exists()) return alert("Room not found");

  host = snap.val().host;

  await set(ref(db, `rooms/${roomCode}/players/${playerName}`), {
    score: 0
  });

  enterLobby();
};

/* ================= LOBBY ================= */
function enterLobby() {
  setup.style.display = "none";
  lobby.style.display = "block";
  roomDisplay.innerText = roomCode;

  if (playerName === host) startBtn.style.display = "block";

  listenPlayers();
  listenRoom();
}

/* ================= PLAYERS ================= */
function listenPlayers() {
  onValue(ref(db, `rooms/${roomCode}/players`), snap => {
    const data = snap.val() || {};
    players.innerHTML = Object.keys(data)
      .map(p => `<p>${p}: ${data[p].score}</p>`)
      .join("");
  });
}

/* ================= ROOM ================= */
function listenRoom() {
  onValue(ref(db, `rooms/${roomCode}`), snap => {
    const data = snap.val();
    if (!data) return;

    if (data.state === "playing") {
      lobby.style.display = "none";
      game.style.display = "block";

      index = data.index || 0;
      load();
    }
  });
}

/* ================= START ================= */
window.startGame = async function () {
  if (playerName !== host) return;

  await update(ref(db, "rooms/" + roomCode), {
    state: "playing",
    index: 0
  });

  load();
};

/* ================= LOAD QUESTION ================= */
function load() {
  const q = questions[index];

  correct = Math.random() < 0.5 ? 0 : 1;

  const opts = correct === 0 ? [q[1], q[0]] : [q[0], q[1]];

  qNum.innerText = `Question ${index + 1} / ${questions.length}`;
  question.innerText = "Which is correct?";
  a1.innerText = opts[0];
  a2.innerText = opts[1];

  startTimer();
}

/* ================= TIMER ================= */
function startTimer() {
  clearInterval(timer);
  let t = 20;

  timer = setInterval(() => {
    t--;
    document.getElementById("timer").innerText = t;
    if (t <= 0) showBoard();
  }, 1000);
}

/* ================= ANSWER ================= */
window.answer = async function (choice) {
  const refP = ref(db, `rooms/${roomCode}/players/${playerName}`);
  const snap = await get(refP);
  let score = snap.val().score;

  if (choice === correct) {
    await update(refP, { score: score + 1 });
  }

  await set(ref(db, `rooms/${roomCode}/answers/${playerName}`), true);

  checkAll();
};

/* ================= CHECK ALL ================= */
async function checkAll() {
  const p = await get(ref(db, `rooms/${roomCode}/players`));
  const a = await get(ref(db, `rooms/${roomCode}/answers`));

  if (Object.keys(a.val() || {}).length >= Object.keys(p.val() || {}).length) {
    showBoard();
  }
}

/* ================= LEADERBOARD ================= */
async function showBoard() {
  const snap = await get(ref(db, `rooms/${roomCode}/players`));
  const data = snap.val();

  board.innerHTML = Object.keys(data)
    .sort((a,b) => data[b].score - data[a].score)
    .map(p => `<p>${p}: ${data[p].score}</p>`)
    .join("");

  leaderboard.style.display = "block";

  setTimeout(() => {
    leaderboard.style.display = "none";
    index++;

    update(ref(db, "rooms/" + roomCode), { index });

    load();
  }, 3000);
}

</script>

</body>
</html>
