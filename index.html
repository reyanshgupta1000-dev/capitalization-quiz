\<!DOCTYPE html>
<html>
<head>
  <title>Capitalization Multiplayer Quiz</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: white;
      text-align: center;
    }

    .topbar {
      position: fixed;
      top: 10px;
      right: 15px;
      background: black;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding-top: 60px;
    }

    .card {
      background: white;
      color: black;
      padding: 20px;
      border-radius: 16px;
      margin: 15px 0;
    }

    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    #game { display: none; }

    .answer {
      display: block;
      width: 80%;
      margin: 10px auto;
      background: #f3f4f6;
      color: black;
    }

    #leaderboardCard { display: none; }

    #timer {
      font-size: 26px;
      color: red;
      font-weight: bold;
    }

    #questionCounter {
      font-size: 18px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="topbar">
  Room: <span id="roomDisplay">---</span>
</div>

<div class="container">

  <h1>🔥 Capitalization Multiplayer Quiz</h1>

  <!-- SETUP -->
  <div id="setup" class="card">
    <h2>Join / Create Game</h2>
    <input id="name" placeholder="Your name">
    <input id="room" placeholder="Room code">
    <br>
    <button onclick="createGame()">Create Game (Host)</button>
    <button onclick="joinRoom()">Join Game</button>
  </div>

  <!-- LOBBY -->
  <div id="lobby" class="card" style="display:none;">
    <h2>Lobby</h2>
    <button id="startBtn" onclick="startGame()" style="display:none;">
      Start Game (Host Only)
    </button>
    <div id="players"></div>
  </div>

  <!-- GAME -->
  <div id="game">

    <div class="card">
      <div id="questionCounter"></div>
      <div id="timer">20</div>
      <h2 id="question"></h2>

      <button class="answer" onclick="answer(0)" id="a1"></button>
      <button class="answer" onclick="answer(1)" id="a2"></button>
    </div>

    <div class="card" id="leaderboardCard">
      <h3>Leaderboard</h3>
      <div id="board"></div>
    </div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue }
from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCBEGw6J76suo9BHgUD1GIiiZbp4ifqJ3E",
  authDomain: "quiz-game-9aa86.firebaseapp.com",
  projectId: "quiz-game-9aa86",
  storageBucket: "quiz-game-9aa86.firebasestorage.app",
  messagingSenderId: "587081071152",
  appId: "1:587081071152:web:203f17274cb2ac99d4cbf5",
  databaseURL: "https://quiz-game-9aa86-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* QUESTIONS */
const questions = [
  ["i went to london", "I went to London"],
  ["my name is alex", "My name is Alex"],
  ["we live in new york", "We live in New York"],
  ["john is my friend", "John is my friend"],
  ["i am happy", "I am happy"],
  ["we went to paris", "We went to Paris"],
  ["she lives in canada", "She lives in Canada"],
  ["i love school", "I love school"],
  ["he is my friend", "He is my friend"],
  ["they live in florida", "They live in Florida"],
  ["we study english", "We study English"],
  ["she is smart", "She is smart"],
  ["my brother is tall", "My brother is tall"],
  ["i play soccer", "I play soccer"],
  ["we are learning grammar", "We are learning grammar"]
];

let playerName = "";
let roomCode = "";
let hostName = "";
let questionIndex = 0;
let correctAnswer = 0;
let timer;

/* CREATE GAME */
window.createGame = async function () {
  playerName = document.getElementById("name").value;
  roomCode = document.getElementById("room").value;
  hostName = playerName;

  await set(ref(db, `rooms/${roomCode}`), {
    host: playerName,
    state: "lobby",
    questionIndex: 0
  });

  await set(ref(db, `rooms/${roomCode}/players/${playerName}`), {
    score: 0
  });

  enterLobby();
};

/* JOIN GAME */
window.joinRoom = async function () {
  playerName = document.getElementById("name").value;
  roomCode = document.getElementById("room").value;

  const snap = await get(ref(db, `rooms/${roomCode}`));
  if (!snap.exists()) return alert("Room not found");

  hostName = snap.val().host;

  await set(ref(db, `rooms/${roomCode}/players/${playerName}`), {
    score: 0
  });

  enterLobby();
};

/* LOBBY */
function enterLobby() {
  document.getElementById("setup").style.display = "none";
  document.getElementById("lobby").style.display = "block";
  document.getElementById("roomDisplay").innerText = roomCode;

  if (playerName === hostName) {
    document.getElementById("startBtn").style.display = "block";
  }

  listenPlayers();
  listenRoom();
}

/* PLAYERS */
function listenPlayers() {
  onValue(ref(db, `rooms/${roomCode}/players`), (snap) => {
    const data = snap.val() || {};
    let html = "";

    for (let p in data) {
      html += `<p><b>${p}</b>: ${data[p].score}</p>`;
    }

    document.getElementById("players").innerHTML = html;
  });
}

/* ROOM */
function listenRoom() {
  onValue(ref(db, `rooms/${roomCode}`), (snap) => {
    const data = snap.val();
    if (!data) return;

    if (data.state === "playing") {
      document.getElementById("lobby").style.display = "none";
      document.getElementById("game").style.display = "block";

      questionIndex = data.questionIndex || 0;
      loadQuestion();
    }
  });
}

/* START GAME */
window.startGame = async function () {
  if (playerName !== hostName) return;

  await update(ref(db, `rooms/${roomCode}`), {
    state: "playing",
    questionIndex: 0
  });

  loadQuestion();
};

/* LOAD QUESTION */
function loadQuestion() {
  const q = questions[questionIndex];

  correctAnswer = Math.random() < 0.5 ? 0 : 1;

  const options = correctAnswer === 0
    ? [q[1], q[0]]
    : [q[0], q[1]];

  document.getElementById("questionCounter").innerText =
    `Question ${questionIndex + 1} / ${questions.length}`;

  document.getElementById("question").innerText = "Which is correct?";
  document.getElementById("a1").innerText = options[0];
  document.getElementById("a2").innerText = options[1];

  startTimer();
}

/* TIMER */
function startTimer() {
  clearInterval(timer);
  let t = 20;

  timer = setInterval(() => {
    t--;
    document.getElementById("timer").innerText = t;
    if (t <= 0) showLeaderboard();
  }, 1000);
}

/* ANSWER */
window.answer = async function (choice) {
  const playerRef = ref(db, `rooms/${roomCode}/players/${playerName}`);
  const snap = await get(playerRef);
  let score = snap.val().score;

  if (choice === correctAnswer) {
    await update(playerRef, { score: score + 1 });
  }

  await set(ref(db, `rooms/${roomCode}/answers/${playerName}`), true);

  checkAllAnswered();
};

/* CHECK ALL ANSWERED */
async function checkAllAnswered() {
  const playersSnap = await get(ref(db, `rooms/${roomCode}/players`));
  const answersSnap = await get(ref(db, `rooms/${roomCode}/answers`));

  const players = playersSnap.val() || {};
  const answers = answersSnap.val() || {};

  if (Object.keys(answers).length >= Object.keys(players).length) {
    showLeaderboard();
  }
}

/* LEADERBOARD */
async function showLeaderboard() {
  const snap = await get(ref(db, `rooms/${roomCode}/players`));
  const data = snap.val();

  let html = "";

  Object.keys(data)
    .sort((a,b) => data[b].score - data[a].score)
    .forEach(p => {
      html += `<p><b>${p}</b>: ${data[p].score}</p>`;
    });

  document.getElementById("board").innerHTML = html;
  document.getElementById("leaderboardCard").style.display = "block";

  setTimeout(() => {
    document.getElementById("leaderboardCard").style.display = "none";
    questionIndex++;
    loadQuestion();
  }, 3000);
}

</script>

</body>
</html>
